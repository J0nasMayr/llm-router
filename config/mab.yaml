# config/mab.yaml
# The API picks "linucb" when present (see run_api._build_services); other
# entries are selectable by removing/reordering. Keys must match the bandit
# constructor signatures in src/bandit/.
linucb:
  alpha: 1.0            # exploration strength
  regularization: 1.0   # ridge lambda for the per-arm design matrix
  seed: 40

epsilon-greedy:
  initial_epsilon: 0.1
  decay_factor: 0.995
  min_epsilon: 0.01
  seed: 40
